name: Release

on:
  push:
    tags:
      - 'v*'

env:
  SCHEME: GiveMeABreak
  PROJECT_DIR: GiveMeABreak
  APP_NAME: "Give Me A Break"

jobs:
  build-and-release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Read project versions
        id: project
        working-directory: GiveMeABreak
        run: |
          MARKETING=$(python3 - <<'PY'
          import re
          text = open("GiveMeABreak.xcodeproj/project.pbxproj").read()
          match = re.search(r"MARKETING_VERSION = ([^;]+);", text)
          print(match.group(1).strip().strip('"') if match else "")
          PY
          )
          BUILD=$(python3 - <<'PY'
          import re
          text = open("GiveMeABreak.xcodeproj/project.pbxproj").read()
          match = re.search(r"CURRENT_PROJECT_VERSION = ([^;]+);", text)
          print(match.group(1).strip().strip('"') if match else "")
          PY
          )
          echo "MARKETING=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "BUILD=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Project marketing=$MARKETING build=$BUILD tag=${{ steps.version.outputs.VERSION }}"
          if [ "$MARKETING" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "Tag v${{ steps.version.outputs.VERSION }} does not match MARKETING_VERSION $MARKETING"
            exit 1
          fi
          if [ -z "$BUILD" ]; then
            echo "Could not read CURRENT_PROJECT_VERSION"
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Prepare ExportOptions plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/__TEAM_ID__/$APPLE_TEAM_ID/g" "$PROJECT_DIR/ExportOptions-DirectDistribution.plist"

      - name: Build archive
        run: |
          xcodebuild archive \
            -project "$PROJECT_DIR/$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ steps.project.outputs.BUILD }}" \
            -quiet

      # ── GitHub Releases (Developer ID) ──

      - name: Export for direct distribution
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/direct" \
            -exportOptionsPlist "$PROJECT_DIR/ExportOptions-DirectDistribution.plist"

      - name: Create ZIP
        run: |
          cd "$RUNNER_TEMP/direct"
          ditto -c -k --keepParent "$APP_NAME.app" "$RUNNER_TEMP/GiveMeABreak-${{ steps.version.outputs.VERSION }}.zip"

      - name: Notarize
        timeout-minutes: 90
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit \
            "$RUNNER_TEMP/GiveMeABreak-${{ steps.version.outputs.VERSION }}.zip" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 60m

          xcrun stapler staple "$RUNNER_TEMP/direct/$APP_NAME.app"

          cd "$RUNNER_TEMP/direct"
          ditto -c -k --keepParent "$APP_NAME.app" "$RUNNER_TEMP/GiveMeABreak-${{ steps.version.outputs.VERSION }}.zip"

      - name: Create DMG
        run: |
          DMG_PATH="$RUNNER_TEMP/GiveMeABreak-${{ steps.version.outputs.VERSION }}.dmg"
          hdiutil create -volname "Give Me A Break" \
            -srcfolder "$RUNNER_TEMP/direct/$APP_NAME.app" \
            -ov -format UDZO "$DMG_PATH"

      - name: Create fixed-name DMG for stable download URL
        run: cp "$RUNNER_TEMP/GiveMeABreak-${{ steps.version.outputs.VERSION }}.dmg" "$RUNNER_TEMP/GiveMeABreak.dmg"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/GiveMeABreak-${{ steps.version.outputs.VERSION }}.zip" \
            "$RUNNER_TEMP/GiveMeABreak-${{ steps.version.outputs.VERSION }}.dmg" \
            "$RUNNER_TEMP/GiveMeABreak.dmg" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # ── Sparkle Appcast ──

      - name: Download Sparkle tools
        run: |
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.9.0/Sparkle-2.9.0.tar.xz" -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP_PATH="$RUNNER_TEMP/GiveMeABreak-${{ steps.version.outputs.VERSION }}.zip"
          APP_PATH="$RUNNER_TEMP/direct/$APP_NAME.app"
          DOWNLOAD_URL="https://github.com/jxucoder/give-me-a-break/releases/download/$GITHUB_REF_NAME/GiveMeABreak-${{ steps.version.outputs.VERSION }}.zip"
          SIGN_UPDATE="$RUNNER_TEMP/sparkle/bin/sign_update"

          export BUILD SHORT LENGTH SIG_ATTR PUBDATE DOWNLOAD_URL APPCAST_OUT
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")
          LENGTH=$(stat -f%z "$ZIP_PATH")
          SIG_ATTR=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" "$ZIP_PATH" --ed-key-file - | grep -o 'sparkle:edSignature="[^"]*"')
          PUBDATE=$(date -R)
          APPCAST_OUT="$RUNNER_TEMP/appcast.xml"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          build = os.environ["BUILD"]
          short = os.environ["SHORT"]
          new_item = f"""    <item>
          <title>Version {short}</title>
          <pubDate>{os.environ["PUBDATE"]}</pubDate>
          <sparkle:version>{build}</sparkle:version>
          <sparkle:shortVersionString>{short}</sparkle:shortVersionString>
          <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
          <enclosure url="{os.environ["DOWNLOAD_URL"]}" length="{os.environ["LENGTH"]}" type="application/octet-stream" {os.environ["SIG_ATTR"]} />
        </item>"""

          existing = Path("docs/appcast.xml").read_text() if Path("docs/appcast.xml").exists() else ""
          kept = []
          for item in re.findall(r"<item>.*?</item>", existing, flags=re.S):
              version = re.search(r"<sparkle:version>(.*?)</sparkle:version>", item)
              if version and version.group(1) != build:
                  kept.append("    " + item.strip())

          items = "\n".join([new_item] + kept[:4])
          Path(os.environ["APPCAST_OUT"]).write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">\n'
              "  <channel>\n"
              "    <title>Give Me A Break</title>\n"
              "    <link>https://givemeabreak.app/appcast.xml</link>\n"
              f"{items}\n"
              "  </channel>\n"
              "</rss>\n"
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/appcast.xml" docs/appcast.xml
          git add docs/appcast.xml
          if git diff --cached --quiet; then
            echo "appcast.xml already up to date"
          else
            git commit -m "Update appcast.xml for $GITHUB_REF_NAME"
            git push origin main
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
